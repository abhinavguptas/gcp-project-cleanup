# ─────────────────────────────────────────────────────────────────
# ORG POLICIES  (applied at project level)
# ─────────────────────────────────────────────────────────────────

org_policies:

  - constraint: constraints/gcp.resourceLocations
    enforce: true
    allowed_values:
      - in:{{ region }}-locations         # e.g. in:us-central1-locations
    rationale: >
      Lock all resource creation to one region.
      Prevents accidental multi-region egress charges.

  - constraint: constraints/iam.disableServiceAccountKeyCreation
    enforce: true
    rationale: >
      JSON key files are a credential leak risk.
      Workloads must use Workload Identity or attached service accounts.

  - constraint: constraints/compute.skipDefaultNetworkCreation
    enforce: true
    rationale: >
      No auto-created VPC if Compute API is ever enabled.
      Forces intentional network design.

  - constraint: constraints/iam.allowedPolicyMemberDomains
    enforce: true
    allowed_values:
      - "{{ org_domain }}"
    rationale: >
      Only team accounts from your domain can be granted IAM roles.
      Blocks sharing with personal Gmail accounts.

  - constraint: constraints/serviceusage.restrictedServices
    enforce: true
    rationale: >
      Hard deny for services outside the expected architecture.
      Cannot be overridden by IAM — even Owner cannot enable these.
      Uncomment optional_bundles above to selectively unblock.
    denied_services:
      - compute.googleapis.com         # no VMs (highest cost risk)
      - container.googleapis.com       # no GKE clusters
      - sqladmin.googleapis.com        # no Cloud SQL (unblock via cloud_sql bundle)
      - redis.googleapis.com           # no Memorystore (unblock via redis bundle)
      - file.googleapis.com            # no Filestore
      - bigquery.googleapis.com        # no BigQuery (not in scope for most apps)
      - dataproc.googleapis.com        # no Dataproc / Spark
      - composer.googleapis.com        # no Cloud Composer (very expensive)
      - notebooks.googleapis.com       # no Vertex AI Workbench notebooks
      - datafusion.googleapis.com      # no Cloud Data Fusion
      - ml.googleapis.com              # legacy AI Platform (use aiplatform instead)

# ─────────────────────────────────────────────────────────────────
# BUDGET
# ─────────────────────────────────────────────────────────────────

budget:
  billing_account: "{{ billing_account }}"
  project: "{{ project_id }}"
  display_name: "AI Cap - {{ project_id }}"   # naming convention: "AI Cap - <project>"
  amount_usd: "{{ budget_usd }}"
  alerts:
    - threshold_percent: 50
      basis: CURRENT_SPEND
      notify: ["{{ owner_email }}"]
    - threshold_percent: 90
      basis: CURRENT_SPEND
      notify: ["{{ owner_email }}", "{{ pm_email }}"]
    - threshold_percent: 100
      basis: CURRENT_SPEND
      notify: ["{{ owner_email }}", "{{ pm_email }}"]
  notes: >
    Budget alerts are informational only by default.
    To auto-disable billing at 100% (kills all running services — use with caution),
    wire the Pub/Sub budget notification topic to a Cloud Function that calls
    billingAccounts.projects.updateBillingInfo with billingAccountName = "".
    Recommended for sandbox/UAT only, not production.

# ─────────────────────────────────────────────────────────────────
# PROD DELTA  (additional restrictions for production environment)
# ─────────────────────────────────────────────────────────────────

prod_delta:
  notes: >
    When env = prod, apply these changes on top of this baseline.

  remove_from_developer:
    - custom_roles/runDeployer          # developers cannot deploy directly in prod
    # CI/CD service account (Cloud Build SA) gets run.services.update instead

  add_to_developer:
    - roles/run.viewer                  # can still read service state and logs

  additional_org_policies:
    - constraint: constraints/run.allowedIngress
      enforce: true
      allowed_values: [is:internal-and-cloud-load-balancing]
      rationale: Cloud Run services in prod must sit behind a load balancer, not public internet.
